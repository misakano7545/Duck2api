name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: freebsd
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${TAG#v}"
          artifact="duck2api-${version}-${GOOS}-${GOARCH}"
          mkdir -p "${artifact}"
          output="duck2api"
          if [ "${GOOS}" = "windows" ]; then
            output="duck2api.exe"
          fi
          go build -trimpath -ldflags="-s -w" -o "${artifact}/${output}" ./cmd/duck2api
          tar -czf "${artifact}.tar.gz" "${artifact}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: duck2api-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: duck2api-*-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*.tar.gz
